{% extends "base.html" %}
{% block title %}Apply – {{ job.title }} – Nexus Careers{% endblock %}

{% block content %}
<div class="container apply-container">
    <a href="{{ url_for('job_detail', job_id=job.id) }}" class="back-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
        Back to job details
    </a>

    <div class="apply-layout">
        <div class="apply-header">
            <div class="job-dept-badge">{{ job.department }}</div>
            <h1>Apply for {{ job.title }}</h1>
            <p class="apply-sub">{{ job.location }} &middot; {{ job.type }}</p>
        </div>

        <form method="post" class="apply-form">
            <div class="form-group">
                <label for="name">Full Name <span class="required">*</span></label>
                <input type="text" id="name" name="name" required placeholder="Jane Smith" />
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="email">Email Address <span class="required">*</span></label>
                    <input type="email" id="email" name="email" required placeholder="jane@example.com" />
                </div>
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" placeholder="+1 (555) 000-0000" />
                </div>
            </div>

            <div class="form-group">
                <label for="cover_letter">Cover Letter</label>
                <textarea id="cover_letter" name="cover_letter" rows="7" placeholder="Tell us why you're excited about this role and what you'd bring to the team..."></textarea>
            </div>

            <div class="form-actions">
                <a href="{{ url_for('job_detail', job_id=job.id) }}" class="btn btn-ghost">Cancel</a>
                <button type="submit" class="btn btn-primary">Submit Application</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
